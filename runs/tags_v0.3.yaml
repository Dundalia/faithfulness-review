# Tag vocabulary for the literature map. v0.3 (revised after the two-coder pilot).
#
# A tag is `namespace:value`, lowercase kebab-case. A paper gets every tag that
# applies; a missing tag means "doesn't apply / not done". This is a seed
# vocabulary, not a closed list: agents may coin new values or new namespaces.
# A coined tag goes under "New tags" in the paper's record with a one-line
# definition; the consolidation step merges synonyms and adds survivors here.
# Namespaces marked "free" take any value (normalized at consolidation).
# Tag what the paper does, not what it merely mentions.

object:            # which model output is supposed to be faithful
  cot: reasoning written before the answer, incl. structured or executable traces
  posthoc-expl: explanation of one decision, written after it
  self-prediction: answer about the model's own behavior on a given or hypothetical input
  self-report: statement about the model's dispositions, behaviors, goals or past conduct
  external-expl: explanation of a different model (incl. tool outputs used as explanations)

reveals:           # what that output must reflect
  planted-cue: a hint or bias inserted into the prompt
  decision-factors: what drives the decision, in the input or in the model's knowledge
  cot-reliance: whether the answer causally depends on the stated reasoning
  internal-strategy: the algorithm or mechanism actually used inside the model
  hidden-behavior: learned behaviors, goals or fine-tuning changes
  misbehavior: reward hacking, scheming or side tasks a monitor should catch
  hidden-info: information encoded beyond the text's surface meaning
  correctness: enough for a (weaker) checker to verify the answer (legibility), regardless of how the model reasoned

signal:            # where the paper's ground truth about faithfulness comes from
  planted-cf: behavior with vs. without a planted cue
  generic-cf: the model's behavior on edited or related inputs, incl. when a simulator must predict it
  wild-cf: counterfactuals for naturally occurring behaviors
  cot-intervention: truncating, corrupting, swapping or paraphrasing the CoT
  implanted-behavior: behaviors trained into a model organism
  interp-tool: probes, attribution, patching, SAEs
  by-construction: guaranteed by the pipeline (solver, executable trace)
  env-label: labels from the environment or a program (unit tests, verifiers, hack checks)
  judge: an LLM judge, monitor or human rating IS the ground truth (not when it is only the instrument scored against real labels)

lever:             # what the paper changes (absent for measurement papers); hybrids get every lever that applies
  prompt-pipeline: prompting or multi-step pipeline structure
  sft: supervised fine-tuning, incl. on rewritten traces and reward-weighted SFT
  preference: DPO or other preference optimization
  rl-reward: RL with a faithfulness or monitorability reward term
  rl-mechanics: changes to how RL updates are applied (masking, gradient routing, KL)
  multi-agent-game: co-trained roles that set each other's rewards (prover-verifier, sneaky adversary)
  steering: activation steering or editing
  inference-time: other test-time procedures (paraphrase, re-query, refine, search)
  architecture: model or output-format changes (bottlenecks, adapters, executable outputs)

updates:           # what the intervention changes to make explanation and behavior match (only for papers with a lever)
  explanation: the explanation or self-report is changed to fit behavior
  behavior: the behavior is changed to fit the explanation or stated principles

contribution:      # headline contributions only (abstract-level claims), not side findings
  method: new intervention that improves the target
  negative-result: an intervention fails or backfires
  metric: new way to measure faithfulness
  benchmark: dataset or evaluation suite
  analysis: empirical study without a new method
  theory: formal or game-theoretic argument
  position: argument or agenda without new experiments

motivation:
  explainability: explanations people can trust
  monitoring: catching misbehavior from the reasoning
  auditing: finding hidden properties of a model
  reasoning-quality: faithful reasoning as a route to accuracy or robustness
  scalable-oversight: letting weaker judges (small models, time-limited humans) check stronger models
  alignment: consistency between stated principles and behavior as a route to safer behavior

domain:            # where it is tested
  mcq: multiple-choice QA
  open-qa: free-form or extractive QA, incl. reading comprehension
  math: math problems
  logic: deductive or symbolic reasoning
  code: programming
  classification: classification or NLI
  social-bias: stereotype or fairness tasks (e.g. BBQ)
  agentic: multi-step agent environments
  chat: open-ended conversation
  multimodal: vision-language
  synthetic: toy tasks built so the ground truth is known

scale:             # every size class the paper trains or intervenes on (MoE: total parameters)
  small: under 10B parameters
  mid: 10B to 100B
  large: over 100B, open weights
  closed: closed-weight models (API or internal), size undisclosed

eval:              # notable properties of the evaluation, tagged only when present
  later-rl: checks whether faithfulness survives later RL
  optimization-pressure: checks faithfulness under training against the monitor or metric itself
  ood: tests on held-out cues, tasks or distributions
  behavior-control: holds behavior fixed (e.g. KL, fixed-behavior eval) to isolate explanation change
  specificity: checks false positives (explanations claiming an influence that is absent)
  adversarial: tested against models or agents optimized to evade or conceal
  privileged-access: compares self-explanation or self-prediction with another model explaining the same target
  human-study: involves human participants

model: free        # lowercase family-size, drop -instruct/-chat/-it suffixes (model:llama-3.1-8b, model:gpt-4o); unnamed closed models as model:<org>-internal
metric: free       # kebab-case name of a primary faithfulness or monitorability metric
source:            # where the paper entered the corpus
  trustme: TrustMe-Litreview bib.bib or main.tex
  faith-improvement: docs/faith-improvement.md
  search-2026-10-14: literature search of 2026-10-14
